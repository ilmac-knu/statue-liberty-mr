<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>내 책상 위의 자유의 여신상 | MR 체험</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d2b;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}#info{position:absolute;z-index:4;top:0;left:0;right:0;padding:14px 15px;background:linear-gradient(#101d2bee,#101d2b00);pointer-events:none}h1{font-size:19px;margin:0 0 6px}#status{font-size:13px;line-height:1.5;color:#e1f2ff}#controls{position:absolute;z-index:5;bottom:78px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;justify-content:center;width:max-content;max-width:96vw;flex-wrap:wrap}button{border:1px solid #ffffff66;background:#193955e8;color:#fff;border-radius:12px;padding:12px 13px;font-size:15px;font-weight:650;touch-action:manipulation}button:disabled{opacity:.4}#footer{position:absolute;bottom:8px;left:10px;right:10px;text-align:center;color:#aabac9;font-size:10px;z-index:2;pointer-events:none}#ar-entry{position:absolute;z-index:6;bottom:20px;left:50%;transform:translateX(-50%);background:#1c8a68;border:0;min-width:150px;display:none}#controls button{min-width:51px}#credit{position:absolute;right:12px;top:83px;font-size:11px;color:#c5d6e7;z-index:4}#credit a{color:#d2edff}canvas{display:block}
</style></head><body><div id="info"><h1>🗽 내 책상 위의 자유의 여신상</h1><div id="status">3D 모델을 불러오는 중입니다.</div></div><div id="credit">3D: <a href="https://sketchfab.com/3d-models/statue-of-liberty-1-b3105217169b4ebbabeefb1d97e3696c" target="_blank" rel="noopener">tech.service.allwe</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></div><div id="controls"><button id="smaller" aria-label="축소">− 축소</button><button id="larger" aria-label="확대">＋ 확대</button><button id="left" aria-label="왼쪽 회전">↶ 회전</button><button id="right" aria-label="오른쪽 회전">↷ 회전</button><button id="reset">재배치</button></div><button id="ar-entry">AR 시작</button><div id="footer">3D 모델: statue_of_liberty (1) © tech.service.allwe · CC BY 4.0 · 웹 체험용 크기·위치 조정</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
import {ARButton} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/webxr/ARButton.js';
const status=document.getElementById('status'),entry=document.getElementById('ar-entry');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x657789,2.3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(1,3,2);scene.add(light);
const statue=new THREE.Group();scene.add(statue);statue.visible=false;
let ready=false,placed=false,hitSource=null,refSpace=null,viewerSpace=null,hitRequested=false,sessionActive=false;
const reticle=new THREE.Mesh(new THREE.RingGeometry(.065,.08,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x00ffc3,side:THREE.DoubleSide}));reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
new GLTFLoader().load('./statue_of_liberty_1.glb',g=>{const model=g.scene;model.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());if(size.y<=0){status.textContent='모형의 크기를 읽을 수 없습니다.';return;}model.position.set(-center.x,-bounds.min.y,-center.z);statue.add(model);statue.scale.setScalar(.28/size.y);ready=true;status.textContent='모형 준비 완료. 스마트폰에서는 AR 시작을 누르세요. PC에서는 미리보기를 확인할 수 있습니다.';if(!sessionActive){statue.visible=true;statue.position.set(0,-.15,-1.2);camera.position.set(0,.08,0);camera.lookAt(0,0,-1.2);}},undefined,e=>{console.error(e);status.textContent='모형을 불러오지 못했습니다. GLB 파일명과 위치를 확인하세요.';});
const button=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});button.style.display='none';document.body.appendChild(button);
if(navigator.xr){navigator.xr.isSessionSupported('immersive-ar').then(ok=>{if(ok){entry.style.display='block';entry.onclick=()=>button.click();}else status.textContent='이 브라우저는 몰입형 AR을 지원하지 않습니다. PC 미리보기는 가능합니다.';}).catch(()=>{});}else status.textContent='WebXR을 지원하지 않는 브라우저입니다. PC 미리보기는 가능합니다.';
renderer.xr.addEventListener('sessionstart',()=>{sessionActive=true;placed=false;statue.visible=false;hitRequested=false;hitSource=null;reticle.visible=false;entry.style.display='none';status.textContent='책상이나 바닥을 천천히 비추세요. 초록 원이 나타나면 화면을 터치하여 배치하세요.';});
renderer.xr.addEventListener('sessionend',()=>{sessionActive=false;hitSource?.cancel();hitSource=null;hitRequested=false;reticle.visible=false;statue.visible=ready;statue.position.set(0,-.15,-1.2);entry.style.display='block';status.textContent='AR이 종료되었습니다. 다시 시작할 수 있습니다.';});
const controller=renderer.xr.getController(0);controller.addEventListener('select',()=>{if(!ready||!sessionActive||!reticle.visible||placed)return;reticle.matrix.decompose(statue.position,new THREE.Quaternion(),new THREE.Vector3());statue.visible=true;placed=true;reticle.visible=false;status.textContent='배치 완료! 스마트폰을 움직여 관찰하고 아래 버튼으로 크기·방향을 조절하세요.';});scene.add(controller);
const act=(id,fn)=>document.getElementById(id).addEventListener('click',e=>{e.stopPropagation();if(ready)fn();});act('smaller',()=>statue.scale.multiplyScalar(.8));act('larger',()=>statue.scale.multiplyScalar(1.25));act('left',()=>statue.rotation.y+=Math.PI/8);act('right',()=>statue.rotation.y-=Math.PI/8);act('reset',()=>{if(sessionActive){placed=false;statue.visible=false;status.textContent='새 위치를 비추고 초록 원이 보이면 화면을 터치하세요.';}else{statue.rotation.y=0;statue.position.set(0,-.15,-1.2);}});
renderer.setAnimationLoop((time,frame)=>{if(sessionActive&&frame){if(!hitRequested){const session=renderer.xr.getSession();session.requestReferenceSpace('viewer').then(space=>{viewerSpace=space;return session.requestHitTestSource({space});}).then(source=>{hitSource=source;}).catch(console.error);hitRequested=true;}if(hitSource&&!placed){const results=frame.getHitTestResults(hitSource);if(results.length){const pose=results[0].getPose(renderer.xr.getReferenceSpace());reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);}else reticle.visible=false;}}else if(ready&&!sessionActive){statue.rotation.y+=.002;}renderer.render(scene,camera);});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
